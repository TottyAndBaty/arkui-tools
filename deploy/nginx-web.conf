# Web 版 nginx 站点样例。复制到 /etc/nginx/conf.d/arkui-web.conf，改 server_name 与 root 后：
#   nginx -t && systemctl reload nginx
# 需要你编辑的只有三处：server_name、root、证书路径（以及要不要打开 /api/ 反代）。

server {
    listen 80;
    server_name arkui.example.com;

    # 上 HTTPS 后打开（certbot --nginx -d arkui.example.com 会自动写入）：
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/arkui.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/arkui.example.com/privkey.pem;

    # 形态 A/B 的静态根：node scripts/pack-web.js 产出的 dist/ 目录内容
    root /var/www/arkui-web;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json;

    # 入口页不缓存，避免改版后用户仍拿到旧 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 形态 A：页面与 AI 接口同源，前端零配置（打包时不写 config.js 就会自动用同源 /api/generate）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务侧对大模型请求没有设超时（Node fetch 默认约 300s），这里兜一道：
        # 超过 120s 就返回 504，网页会提示"服务不可用"并回退本地规则生成，界面不卡死。
        proxy_read_timeout 120s;

        # 限流需先在 http {} 块里定义区域，再把下面这行打开，否则 nginx -t 直接报错：
        #   limit_req_zone $binary_remote_addr zone=arkui_api:10m rate=5r/s;
        # limit_req zone=arkui_api burst=10 nodelay;
    }

    # 形态 B：AI 服务在别的域名/机器，不需要上面的 /api/。
    # 改成把 dist/config.js 写成：window.ARKUI_ENDPOINT = 'https://api.example.com/api/generate';
    # （即打包时用 node scripts/pack-web.js dist https://api.example.com/api/generate）

    # 只有"不打包、直接把工程 web/ 当 root"的布局才需要这段：
    # index.html 引用 ../shared/*.js，浏览器解析成站点根的 /shared/*.js，而 web/ 里并没有 shared/。
    # 用 dist/ 出包时 shared/ 已在站点根，请保持注释，否则 alias 会盖掉真实文件导致 404。
    # location /shared/ {
    #     alias /opt/arkui/arkui-drag-drop-tool/shared/;
    # }
}

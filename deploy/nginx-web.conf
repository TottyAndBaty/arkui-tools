# Web 版站点配置样例。放到 /etc/nginx/conf.d/arkui-web.conf 后 `nginx -t && systemctl reload nginx`
# 三选一：A 静态托管 + 同源反代 AI 服务　B 纯静态（AI 服务在别的域名，靠 config.js 指定）　C 整个交给 Node 服务反代

server {
    listen 80;
    server_name arkui.example.com;
    # 正式环境用 certbot 签发后打开：
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/arkui.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/arkui.example.com/privkey.pem;

    # 静态包 = node scripts/pack-web.js 产出的 dist/ 内容
    root /var/www/arkui-web;
    index index.html;

    # index.html 里是 ../shared/xxx.js，浏览器按站点根解析成 /shared/xxx.js
    # dist/ 已自带 shared/ 目录，所以这段只在"保留工程结构"的布局 B 下才需要
    location /shared/ {
        alias /opt/arkui/arkui-drag-drop-tool/shared/;
        types { } default_type text/javascript;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json;

    # 带内容本身、更新即失效的入口页不缓存；js/css 交给浏览器协商缓存即可
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 形态 A：页面和 AI 接口同源，前端不用改任何配置
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;          # 大于服务侧 60s 模型超时，避免 504
        limit_req zone=arkui_api burst=10 nodelay;
    }

    # 形态 B：不写这段，改成把 dist/config.js 填成远端服务地址
    #   window.ARKUI_ENDPOINT = 'https://api.example.com/api/generate';
    # 远端服务必须允许本站点跨域（自带 Access-Control-Allow-Origin: *，已满足）
}

# 配合上面的 limit_req；放在 http 块（/etc/nginx/nginx.conf）里
# limit_req_zone $binary_remote_addr zone=arkui_api:10m rate=5r/s;
